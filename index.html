<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PackTracker Ireland</title>
    <!-- Tailwind CSS for mobile-optimized UI styling -->
    <script src="https://tailwindcss.com"></script>
    <style>
        .breeze-bg { background-color: #f0fdfa; }
        .radar-grid { background-image: radial-gradient(#115e59 1px, transparent 1px); background-size: 16px 16px; }
    </style>
</head>
<body class="breeze-bg font-sans min-h-screen text-slate-800 pb-20">

    <!-- App Navbar Layer -->
    <header class="bg-teal-600 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wide">⚡ PackTracker Ireland</h1>
            <span class="text-xs bg-teal-800 px-2 py-1 rounded-full font-medium">Live Radar Link</span>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">
        
        <!-- Live Map Interface Box (Native Vector Engine) -->
        <div class="bg-white rounded-xl shadow-sm border border-teal-100 overflow-hidden">
            <div class="p-3 bg-teal-50 border-b border-teal-100 flex justify-between items-center">
                <h2 class="font-semibold text-teal-900 flex items-center gap-1.5">📍 County Cork Live Tracker Map</h2>
                <p class="text-[10px] text-slate-500 bg-white px-2 py-0.5 rounded border border-teal-200">Active</p>
            </div>
            
            <!-- Visual Geographic Grid System -->
            <div class="relative w-full h-[320px] bg-slate-900 border-b border-slate-800 p-4 overflow-hidden flex flex-col justify-between radar-grid">
                
                <!-- Inner Layout Map Elements -->
                <div class="flex justify-between items-start z-10">
                    <span class="text-[10px] text-slate-500 font-mono font-bold uppercase tracking-wider">Sector: Co. Cork</span>
                    <span class="text-[10px] text-teal-400 font-mono" id="liveClock">00:00:00</span>
                </div>

                <!-- Interactive Store Pin Overlays -->
                <div class="absolute inset-0 w-full h-full p-6">
                    
                    <!-- Store 1: The Comic Vault (Cork City Centre - Top Right Sector) -->
                    <button onclick="inspectStore('comic-vault-cork')" class="absolute top-[20%] right-[25%] flex flex-col items-center group focus:outline-none transition-transform active:scale-95 z-20">
                        <div class="w-4 h-4 rounded-full border-2 border-white shadow-md animate-pulse transition-colors" id="pin-comic-vault-cork" style="background-color: #94a3b8;"></div>
                        <span class="text-[10px] bg-slate-900/90 text-white px-1.5 py-0.5 rounded mt-1 font-bold tracking-tight border border-slate-700 shadow shadow-black">Cork City Centre</span>
                    </button>

                    <!-- Store 2: Smyths Toys (Kinsale Road - Mid Right Sector) -->
                    <button onclick="inspectStore('smyths-cork')" class="absolute top-[48%] right-[35%] flex flex-col items-center group focus:outline-none transition-transform active:scale-95 z-20">
                        <div class="w-4 h-4 rounded-full border-2 border-white shadow-md transition-colors" id="pin-smyths-cork" style="background-color: #94a3b8;"></div>
                        <span class="text-[10px] bg-slate-900/90 text-white px-1.5 py-0.5 rounded mt-1 font-bold tracking-tight border border-slate-700 shadow shadow-black">Smyths Toys</span>
                    </button>

                    <!-- Store 3: Tesco Superstore (Bandon - Bottom Left Sector) -->
                    <button onclick="inspectStore('tesco-bandon')" class="absolute bottom-[25%] left-[20%] flex flex-col items-center group focus:outline-none transition-transform active:scale-95 z-20">
                        <div class="w-4 h-4 rounded-full border-2 border-white shadow-md transition-colors" id="pin-tesco-bandon" style="background-color: #94a3b8;"></div>
                        <span class="text-[10px] bg-slate-900/90 text-white px-1.5 py-0.5 rounded mt-1 font-bold tracking-tight border border-slate-700 shadow shadow-black">Tesco Bandon</span>
                    </button>

                </div>

                <!-- Dynamic Metadata Hud Panel -->
                <div class="bg-slate-950/90 border border-slate-800 rounded-lg p-3 text-white z-10 backdrop-blur-sm shadow-xl">
                    <div id="inspectorPanel">
                        <p class="text-xs text-slate-400 font-medium">ℹ️ Map Inspection Mode</p>
                        <p class="text-sm font-bold text-slate-200 mt-0.5">Tap a store location pin above to scan shelf files.</p>
                    </div>
                </div>

            </div>
        </div>

        <!-- Submission Input Fields -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-teal-100 space-y-3">
            <h2 class="font-bold text-lg text-teal-900 flex items-center gap-2">📝 Log a Shelf Report</h2>
            
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">1. Select Irish Store</label>
                <select id="storeSelect" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 focus:ring-2 focus:ring-teal-500 focus:outline-none font-medium">
                    <option value="tesco-bandon">Tesco Superstore (Bandon, Cork)</option>
                    <option value="smyths-cork">Smyths Toys Superstores (Kinsale Rd, Cork)</option>
                    <option value="comic-vault-cork">The Comic Vault (Oliver Plunkett St, Cork)</option>
                </select>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">2. TCG Set</label>
                    <select id="setSelect" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 focus:ring-2 focus:ring-teal-500 focus:outline-none font-medium">
                        <option value="Pokémon: Temporal Forces">Pokémon: Temporal Forces</option>
                        <option value="Pokémon: Shrouded Fable">Pokémon: Shrouded Fable</option>
                        <option value="Pokémon: 151 Special Set">Pokémon: 151 Box</option>
                        <option value="Lorcana: Inklands">Lorcana: Inklands</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">3. Shelf Level</label>
                    <select id="statusSelect" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2.5 font-bold focus:ring-2 focus:ring-teal-500 focus:outline-none">
                        <option value="Full" class="text-green-600">🟢 Full Stock</option>
                        <option value="Low" class="text-yellow-600">🟡 Low Stock</option>
                        <option value="Out" class="text-red-600">🔴 Out of Stock</option>
                    </select>
                </div>
            </div>

            <button onclick="submitReport()" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 rounded-lg transition-all shadow-md shadow-teal-100 active:scale-[0.98]">
                Broadcast Live Update
            </button>
        </div>

        <!-- Real-Time Activity Log Feed -->
        <div class="space-y-2">
            <h3 class="font-bold text-sm text-slate-500 uppercase tracking-wider px-1">Live Feed Dashboard</h3>
            <div id="feedContainer" class="space-y-2"></div>
        </div>

    </main>

    <!-- App Logic Script -->
    <script>
        const storeDetails = {
            "tesco-bandon": { name: "Tesco Superstore Bandon", location: "Brooks Horgan Quay, Bandon" },
            "smyths-cork": { name: "Smyths Toys Kinsale Rd", location: "Kinsale Road Retail Park, Cork" },
            "comic-vault-cork": { name: "The Comic Vault Cork", location: "Oliver Plunkett St, Cork City" }
        };

        let reports = JSON.parse(localStorage.getItem('tcg_reports')) || [
            { id: 1, storeKey: "tesco-bandon", set: "Pokémon: Temporal Forces", status: "Full", time: "10:15 AM" },
            { id: 2, storeKey: "smyths-cork", set: "Pokémon: 151 Box", status: "Low", time: "09:44 AM" }
        ];

        function getStatusHex(status) {
            if (status === 'Full') return '#22c55e'; // Green
            if (status === 'Low') return '#eab308';  // Yellow
            return '#ef4444';                     // Red
        }

        function inspectStore(key) {
            const store = storeDetails[key];
            const panel = document.getElementById('inspectorPanel');
            
            // Find the most recent update for this specific location
            const match = reports.filter(r => r.storeKey === key).pop();
            
            if (match) {
                const colors = { 'Full': 'text-green-400', 'Low': 'text-yellow-400', 'Out': 'text-red-400' };
                const dots = { 'Full': '🟢', 'Low': '🟡', 'Out': '🔴' };
                panel.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <h4 class="text-sm font-bold text-teal-400">${store.name}</h4>
                            <p class="text-[11px] text-slate-400">${store.location}</p>
                        </div>
                        <span class="text-xs font-bold ${colors[match.status]}">${dots[match.status]} ${match.status}</span>
                    </div>
                    <div class="mt-2 border-t border-slate-800 pt-1.5 flex justify-between text-xs">
                        <span class="text-slate-300 font-medium">📦 Set: ${match.set}</span>
                        <span class="text-slate-500 text-[11px]">Logged: ${match.time}</span>
                    </div>
                `;
            } else {
                panel.innerHTML = `
                    <h4 class="text-sm font-bold text-slate-300">${store.name}</h4>
                    <p class="text-xs text-slate-500 mt-1">⚠️ No local community reports logged for this position yet.</p>
                `;
            }
        }

        function renderApp() {
            const feed = document.getElementById('feedContainer');
            if(!feed) return;
            feed.innerHTML = '';

            const activeStoreStatus = {};

            // 1. Process data entries and build activity timeline blocks
            reports.forEach(report => {
                activeStoreStatus[report.storeKey] = report;

                const colorMap = { 'Full': 'text-green-800 bg-green-100 border-green-200', 'Low': 'text-yellow-800 bg-yellow-100 border-yellow-200', 'Out': 'text-red-800 bg-red-100 border-red-200' };
                const dotMap = { 'Full': '🟢', 'Low': '🟡', 'Out': '🔴' };
                
                const card = document.createElement('div');
                card.style.cssText = "background: white; padding: 14px; border-radius: 12px; border: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);";
                card.innerHTML = `
                    <div>
                        <strong style="font-size: 14px; color: #1e293b;">${storeDetails[report.storeKey].name}</strong>
                        <div style="font-size: 12px; color: #64748b; margin-top: 2px;">${report.set}</div>
                    </div>
                    <div style="text-align: right;">
                        <span style="font-size: 11px; font-weight: bold; padding: 4px 8px; border-radius: 6px; border: 1px solid;" class="${colorMap[report.status]}">${dotMap[report.status]} ${report.status}</span>
                        <div style="font-size: 10px; color: #94a3b8; margin-top: 4px;">Updated: ${report.time}</div>
                    </div>
                `;
                feed.prepend(card);
            });

            // 2. Direct map marker elements color nodes matching live database status states
            Object.keys(storeDetails).forEach(key => {
                const pin = document.getElementById(`pin-${key}`);
                if (pin) {
                    const currentReport = activeStoreStatus[key];
                    pin.style.backgroundColor = currentReport ? getStatusHex(currentReport.status) : '#64748b';
                }
            });
        }

        function submitReport() {
            const storeKey = document.getElementById('storeSelect').value;
            const set = document.getElementById('setSelect').value;
            const status = document.getElementById('statusSelect').value;
            
            const now = new Date();
            const timeString = now.toLocaleTimeString('en-IE', { hour: '2-digit', minute: '2-digit' });

            const newReport = {
                id: Date.now(),
                storeKey: storeKey,
                set: set,
                status: status,
                time: timeString
            };

            reports.push(newReport);
            localStorage.setItem('tcg_reports', JSON.stringify(reports));
            renderApp();
            inspectStore(storeKey); // Auto-focus panel layout on the updated position data node
        }

        // Keep active clock timestamp rolling in header bounds
        setInterval(() => {
            const now = new Date();
            document.getElementById('liveClock').innerText = now.toLocaleTimeString('en-IE');
        }, 1000);

        renderApp();
    </script>
</body>
</html>
